unit_tests:
  - name: test_stg_jaffle_shop__orders_status_values
    description: Ensure the status field only contains expected values.
    model: stg_jaffle_shop__orders
    given:
      - input: source('jaffle_shop', 'orders')
        rows:
          - {id: 1, status: 'placed'}
          - {id: 2, status: 'shipped'}
          - {id: 3, status: 'completed'}
          - {id: 4, status: 'return_pending'}
          - {id: 5, status: 'returned'}
          - {id: 6, status: 'invalid_status'}
    expect:
      rows:
        - {order_id: 1, order_status: 'placed'}
        - {order_id: 2, order_status: 'shipped'}
        - {order_id: 3, order_status: 'completed'}
        - {order_id: 4, order_status: 'return_pending'}
        - {order_id: 5, order_status: 'returned'}
        - {order_id: 6, order_status: 'invalid_status'}
  
  - name: test_stg_jaffle_shop__orders_days_since_ordered_values
    description: Ensure the days_since_ordered field is calculated correctly.
    model: stg_jaffle_shop__orders
    overrides:
      macros:
       dbt.current_timestamp: "date('2026-08-07')"
    given:
      - input: source('jaffle_shop', 'orders')
        rows:
          - {order_date: '2026-08-01'}
    expect:
      rows:
        - {order_date: '2026-08-01', days_since_ordered: 6}

